{% extends "base.html" %}
{% block body %}
<h1>巡检记录</h1>
<table>
  <thead><tr><th>编号</th><th>实测光强</th><th>结论</th><th>说明</th><th>批次票</th><th></th></tr></thead>
  <tbody>
  {% for row in rows %}
    <tr>
      <td>{{ row.aid_code }}</td>
      <td>{{ row.measured_cd }}</td>
      <td class="{% if row.verdict == '合格' %}ok{% else %}bad{% endif %}">{{ row.verdict }}</td>
      <td>{{ row.note }}</td>
      <td>
        {% if row.batch %}
          <a href="{% url 'batch_detail' row.batch_id %}">{{ row.batch.ticket_no }}</a>
        {% else %}—{% endif %}
      </td>
      <td><a href="{% url 'detail' row.pk %}">详情</a></td>
    </tr>
  {% empty %}
    <tr><td colspan="6">还没有记录</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
